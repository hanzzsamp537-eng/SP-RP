name: build
on: workflow_dispatch
jobs:
  compile:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install sampctl
        run: |
          gh release download 1.11.3 -R Southclaws/sampctl -p "*windows_amd64*"
          for f in sampctl*windows_amd64*; do
            case "$f" in
              *.zip) 7z x -y "$f" ;;
              *.tar.gz) tar xzf "$f" ;;
            esac
          done
          ./sampctl.exe version

      - name: Install VC runtimes
        run: |
          choco install vcredist2010 vcredist2012 vcredist2013 vcredist140 -y --no-progress --ignore-checksums || true

      - name: Fix pawn.json
        run: |
          jq '.dependencies += ["IS4Code/PawnPlus:v1.5.3", "maddinat0r/samp-discord-connector:v0.3.6-pre"]' pawn.json > pawn.tmp
          mv pawn.tmp pawn.json

      - name: Ensure
        run: ./sampctl.exe ensure

      - name: Fix includes
        run: |
          sed -i '/#include.*crashdetect/ s#^#// #' gamemodes/config/includes.pwn
          printf '#if defined _INC_foreach_shim\n#endinput\n#endif\n#define _INC_foreach_shim\n#include <YSI_Data\\y_iterate>\n' > legacy/foreach.inc
          cp dependencies/samp-discord-connector/discord-connector.inc.in legacy/discord-connector.inc
          sed -i -E 's/@[A-Za-z_]+@/0/g' legacy/discord-connector.inc

      - name: Build
        id: build
        continue-on-error: true
        run: ./sampctl.exe build

      - name: Diagnose compiler
        if: steps.build.outcome == 'failure'
        run: |
          P="$HOME/AppData/Roaming/sampctl/pawn/3.10.10/pawncc.exe"
          "$P" > /tmp/out.txt 2>&1; echo "exit=$?"; head -5 /tmp/out.txt
          D=$(ls -d "/c/Program Files/Microsoft Visual Studio/"*/*/VC/Tools/MSVC/*/bin/Hostx64/x64 2>/dev/null | tail -1)
          echo "dumpbin dir: $D"
          MSYS_NO_PATHCONV=1 "$D/dumpbin.exe" /dependents "$P" "$(dirname "$P")/pawnc.dll" 2>&1 | grep -iE "dll|machine" | head -30

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: sprp-amx
          path: |
            gamemodes
            scriptfiles
            models
            legacy

      - name: Result
        if: steps.build.outcome == 'failure'
        run: exit 1
