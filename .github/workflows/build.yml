name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install sampctl
        run: |
          curl -L https://github.com/Southclaws/sampctl/releases/download/1.11.3/sampctl_1.11.3_linux_amd64.tar.gz | tar xz
          sudo mv sampctl /usr/local/bin/
          sampctl version
      - run: sampctl ensure
      - run: sampctl build
      - uses: actions/upload-artifact@v4
        with:
          name: sprp-build
          path: |
            gamemodes
            dependencies
            scriptfiles
            models
