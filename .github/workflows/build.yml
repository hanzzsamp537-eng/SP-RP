name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install sampctl
        run: |
          curl -L https://github.com/Southclaws/sampctl/releases/download/1.11.3/sampctl_1.11.3_linux_amd64.tar.gz | tar xz
          sudo mv sampctl /usr/local/bin/
          sampctl version

      - name: Fix pawn.json
        run: |
          sed -i 's#\\\+#/#g' pawn.json
          jq '.dependencies += ["IS4Code/PawnPlus:v1.5.3"]' pawn.json > pawn.tmp
          mv pawn.tmp pawn.json

      - name: Ensure
        run: sampctl ensure

      - name: Fix includes
        run: |
          sed -i '/#include.*crashdetect/ s#^#// #' gamemodes/config/includes.pwn
          find gamemodes legacy -type f \( -name "*.pwn" -o -name "*.inc" \) -exec sed -i '/#include/ s#\\#/#g' {} +
          sed -i '1i #pragma compat 1' gamemodes/gamemode.pwn
          head -3 gamemodes/gamemode.pwn

      - name: Info
        run: |
          grep -rnE "include.*(callbacks.pwn|newspaper/header|zmessage|foreach|discord-connector)" gamemodes legacy | head -20
          echo "--- legacy"; ls legacy | head -50
          echo "--- gamemodes"; ls gamemodes | head -50

      - name: Build
        run: sampctl build

      - uses: actions/upload-artifact@v4
        with:
          name: sprp-build
          path: |
            gamemodes
            dependencies
            scriptfiles
            models
