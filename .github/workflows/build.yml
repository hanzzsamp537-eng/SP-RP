name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install sampctl
        run: |
          curl -L https://github.com/Southclaws/sampctl/releases/download/1.11.3/sampctl_1.11.3_linux_amd64.tar.gz | tar xz
          sudo mv sampctl /usr/local/bin/
          sampctl version

      - name: Fix pawn.json
        run: |
          sed -i 's#\\\+#/#g' pawn.json
          jq '.dependencies += ["IS4Code/PawnPlus:v1.5.3", "maddinat0r/samp-discord-connector:v0.3.6-pre"]' pawn.json > pawn.tmp
          mv pawn.tmp pawn.json

      - name: Ensure
        run: sampctl ensure

      - name: Fix includes
        run: |
          sed -i '/#include.*crashdetect/ s#^#// #' gamemodes/config/includes.pwn
          find gamemodes legacy -type f \( -name "*.pwn" -o -name "*.inc" \) -exec sed -i '/#include/ s#\\#/#g' {} +
          sed -i '1i #pragma compat 1' gamemodes/gamemode.pwn
          printf '#if defined _INC_foreach_shim\n#endinput\n#endif\n#define _INC_foreach_shim\n#include <YSI_Data/y_iterate>\n' > legacy/foreach.inc
          find dependencies legacy -type f -name "*.inc" | while read -r f; do
            d=$(dirname "$f"); b=$(basename "$f"); l=$(echo "$b" | tr 'A-Z' 'a-z')
            if [ "$b" != "$l" ] && [ ! -e "$d/$l" ]; then ln -s "$b" "$d/$l"; fi
          done
          true

      - name: Info
        run: |
          grep -rnE "callbacks.pwn|zmessage" gamemodes legacy | head -20
          find . -iname "callbacks.pwn" -o -iname "zmessage*" -o -iname "discord-connector*" | head -20

      - name: Build
        run: sampctl build

      - uses: actions/upload-artifact@v4
        with:
          name: sprp-build
          path: |
            gamemodes
            dependencies
            scriptfiles
            models
