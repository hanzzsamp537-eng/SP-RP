name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install sampctl
        run: |
          curl -L https://github.com/Southclaws/sampctl/releases/download/1.11.3/sampctl_1.11.3_linux_amd64.tar.gz | tar xz
          sudo mv sampctl /usr/local/bin/
          sampctl version

      - name: Fix pawn.json
        run: sed -i 's#\\\+#/#g' pawn.json

      - name: Ensure
        run: sampctl ensure

      - name: Fix includes
        run: |
          sed -i '/#include.*crashdetect/ s#^#// #' gamemodes/config/includes.pwn
          find gamemodes legacy -type f \( -name "*.pwn" -o -name "*.inc" \) -exec sed -i '/#include/ s#\\#/#g' {} +

      - name: Check missing includes
        run: |
          find gamemodes legacy -type f \( -name "*.pwn" -o -name "*.inc" \) -exec grep -hoE '#include[[:space:]]*[<"][^>"]+[>"]' {} + \
            | sed -E 's/#include[[:space:]]*[<"]([^>"]+)[>"]/\1/' | sort -u | while read -r inc; do
              if ! find . \( -ipath "*/$inc" -o -ipath "*/$inc.inc" -o -ipath "*/$inc.pwn" \) | grep -q .; then
                echo "MISSING: $inc"
              fi
            done | head -60

      - name: Build
        run: sampctl build

      - uses: actions/upload-artifact@v4
        with:
          name: sprp-build
          path: |
            gamemodes
            dependencies
            scriptfiles
            models
